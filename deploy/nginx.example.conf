# ============================================================
# nginx reverse proxy para o FalaHub na VPS.
#
# A app Next.js roda em 127.0.0.1:3000 com basePath=/painel/falahub
# (ver next.config.ts). O nginx termina TLS em app.noratech.com.br
# e proxia tudo para a app.
#
# A URL pública do produto é https://noratech.com.br/painel/falahub —
# o site institucional (Vercel) tem um rewrite que encaminha esse
# subpath para cá. Webhook do Meta também aponta para esta VPS
# diretamente, sem passar pelo Vercel.
#
# Como instalar:
#   sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/app.noratech.com.br
#   sudo ln -s /etc/nginx/sites-available/app.noratech.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.noratech.com.br
# ============================================================

# Redirect HTTP -> HTTPS (o certbot ajusta depois, mas deixa aqui pra comecar)
server {
    listen 80;
    listen [::]:80;
    server_name app.noratech.com.br;

    # Necessario para o Certbot validar o dominio via HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.noratech.com.br;

    # Os certificados reais sao escritos pelo certbot. As linhas abaixo
    # sao placeholders — descomente e ajuste se estiver configurando
    # manualmente; caso contrario o certbot injeta sozinho.
    # ssl_certificate     /etc/letsencrypt/live/app.noratech.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.noratech.com.br/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seguranca basica
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Limite de upload (Meta envia midia ate ~16MB)
    client_max_body_size 20m;

    # O webhook do Meta precisa responder rapido (< 10s).
    # Timeout generoso nas rotas de API para SSE/streaming.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    # SSE:
    proxy_buffering    off;
    proxy_cache        off;
    proxy_set_header   Connection        "";
    proxy_read_timeout 24h;

    # Quem cair na raiz do subdomain por engano vai pra URL canonica
    # da plataforma (proxiada pelo Vercel).
    location = / {
        return 301 https://noratech.com.br/painel/falahub/;
    }

    # A app Next.js ja esta montada em /painel/falahub via basePath.
    # Sem path rewrite — repassa cru.
    location /painel/falahub {
        proxy_pass http://127.0.0.1:3000;
    }
}
